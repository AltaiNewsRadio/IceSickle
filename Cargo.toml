# Host-side workspace root.
#
# Deliberately a *virtual* manifest with no build target of its own. The repo
# root used to be the esp-idf firmware package, which meant a
# `.cargo/config.toml` here pinning `target = xtensa-esp32s3-espidf` and
# `[unstable] build-std`. Cargo discovers config by walking up from the working
# directory, so every host crate in the tree inherited that pin and had to be
# built from *outside* the repo to escape it. Four crates needed that
# workaround; v2 would have added three more.
#
# So the firmware moved under `firmware/`, taking its config with it, and what
# is left at the root is the part that builds for the host on stable:
#
#     cargo test              # everything here, no incantation
#
# The firmware crates are excluded rather than members: each has its own
# toolchain pin, its own target, and its own lockfile, and none of that survives
# being unified into one workspace.
#
#     cd firmware/esp-idf && cargo build --release    # xtensa, esp toolchain
#     cd firmware/nostd   && cargo build --release    # xtensa bare-metal
#
[workspace]
resolver = "2"
members = [
    "crates/icesickle-core",
    "tools/verify-attestation",
]
exclude = ["firmware"]
