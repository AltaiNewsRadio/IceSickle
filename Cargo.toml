# Host-side workspace root.
#
# Deliberately a *virtual* manifest with no build target of its own. The repo
# root was once the firmware package itself, which meant a `.cargo/config.toml`
# here pinning an xtensa target and `build-std`. Cargo discovers config by
# walking up from the working directory, so every host crate inherited that pin
# and had to be built from *outside* the repo to escape it.
#
# The firmware now lives under `firmware/` and owns that config, so what is left
# at the root builds for the host on stable with no incantation:
#
#     cargo test -p icesickle-core
#     cargo test -p verify-attestation
#
# Separately, not `--workspace`: cargo's v2 resolver unifies features across the
# packages one invocation selects, and verify-attestation pulls ed25519-dalek
# with `std`, which would build icesickle-core against a std-enabled graph and
# hide a no_std regression.
#
# The firmware is excluded rather than a member: it has its own toolchain pin,
# target and lockfile, none of which survive being unified into one workspace.
#
#     cd firmware/nostd && cargo build --release
#
[workspace]
resolver = "2"
members = [
    "crates/icesickle-core",
    "tools/verify-attestation",
]
exclude = ["firmware"]
