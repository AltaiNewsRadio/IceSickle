[package]
name = "verify-attestation"
version = "0.1.0"
edition = "2021"
description = "Host-side verifier for IceSickle attestations captured from a serial log"
license = "Apache-2.0"
publish = false

# Host tool, and a member of the root workspace: `cargo test` from the repo root
# covers it. The firmware crates under firmware/ are excluded from that
# workspace, so nothing here inherits an xtensa target.

[dependencies]
ed25519-dalek = "2"
# Shares ATTESTATION_PAYLOAD_LEN and the payload type with the firmware rather
# than restating them, so the two cannot drift.
icesickle-core = { path = "../../crates/icesickle-core" }
