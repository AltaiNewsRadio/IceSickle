name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # esp-idf firmware (firmware/esp-idf).
  #
  # Built from its own directory, which is where its .cargo/config.toml lives.
  # That config pins the xtensa target and build-std; keeping it inside the
  # crate is the whole reason the host jobs below need no incantation.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup ESP-RS toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true
          # Pinned, but the pin is not what keeps this job green. espup queries
          # the GitHub releases API to resolve the version either way, so a
          # pinned version still spends a request.
          version: 1.97.0.0
        env:
          # Unauthenticated, that request is capped at 60/hour per IP and shared
          # with every other Actions runner, which is how four jobs installing
          # the same toolchain earn a 403. espup adds a Bearer header when this
          # is set (espup src/toolchain/mod.rs), lifting the cap to 1000/hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            firmware/esp-idf/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('firmware/esp-idf/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        working-directory: firmware/esp-idf
        run: cargo build --release --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup ESP-RS toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true
          version: 1.97.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            firmware/esp-idf/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('firmware/esp-idf/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        working-directory: firmware/esp-idf
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: firmware/esp-idf
        run: cargo clippy --all-targets --locked -- -D warnings

  # Enforce no-network policy (WiFi/BLE disabled by design).
  #
  # The pattern list is deliberately restricted to API symbols that cannot occur
  # in English prose. An earlier version matched the bare substring "ble", which
  # flagged "extensible", "stable" and "Unlinkable" in doc comments.
  #
  # Scope is the device code: both firmware crates and the shared core. The host
  # verifier under tools/ is not part of the device and is not scanned.
  no-network-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for forbidden network symbols
        run: |
          echo "Scanning Rust sources for networking APIs..."
          if grep -rnE --include="*.rs" --exclude-dir=target \
            '\b(esp_wifi|esp_now|esp_bt|esp_bluedroid|esp_nimble|esp_netif|esp_eth|esp_tls|esp_http|esp_websocket|esp_mqtt|lwip)\b|\b(EspWifi|WifiDriver|AsyncWifi|BleDriver|BtDriver|EspNetif|EspEth|EspHttp|EspMqtt|TcpStream|TcpListener|UdpSocket)\b|\bstd::net\b' \
            firmware/ crates/; then
            echo "::error::Network symbols found. IceSickle is designed to be network-free; see THREAT_MODEL.md."
            exit 1
          fi
          echo "No network symbols found"

      - name: Verify no radio crates in any dependency graph
        run: |
          echo "Scanning manifests and lockfiles for radio crates..."
          # Radios are opt-in transport tiers, added deliberately and later.
          # Nothing should pull one in today -- including transitively, which is
          # why the lockfiles are scanned and not just the manifests.
          if grep -rnE --include="Cargo.lock" '^name = "(esp-radio|esp-wifi|esp-now|trouble|trouble-host|bleps|esp-ieee802154)"' .; then
            echo "::error::A radio crate is in the dependency graph. IceSickle is radio-silent by default; radios are opt-in transport tiers introduced deliberately."
            exit 1
          fi
          if grep -rnE --include="Cargo.toml" '^[[:space:]]*(esp-radio|esp-wifi|esp-now|trouble|trouble-host|bleps|esp-ieee802154)[[:space:]]*=' .; then
            echo "::error::A radio crate is declared as a dependency. See THREAT_MODEL.md."
            exit 1
          fi
          echo "No radio crates in any dependency graph"

      - name: Verify sdkconfig disables networking
        working-directory: firmware/esp-idf
        run: |
          echo "Checking sdkconfig.defaults..."
          if ! grep -q "CONFIG_BT_ENABLED=n" sdkconfig.defaults; then
            echo "::error::Bluetooth not explicitly disabled in sdkconfig.defaults"
            exit 1
          fi
          if ! grep -q "CONFIG_ESP_WIFI_ENABLED=n" sdkconfig.defaults; then
            echo "::error::WiFi not explicitly disabled in sdkconfig.defaults"
            exit 1
          fi
          echo "Network disabled in sdkconfig"

  # Manifest / lockfile validation for the esp-idf crate, on stable, without the
  # ESP toolchain.
  #
  # This is NOT a test job. Every module in firmware/esp-idf/src depends on
  # esp-idf-*, so `cargo test` cannot run on a host target there; the unit tests
  # in attestation.rs and cooldown.rs only execute when built for xtensa. Making
  # them host-runnable requires target-gating the esp-idf deps -- or finishing
  # the move to the no_std crate, which shares its logic through icesickle-core.
  #
  # The other two lockfiles are checked by `--locked` in the jobs that build
  # them: firmware/nostd below, and the root workspace in `host`.
  manifest:
    runs-on: ubuntu-latest
    env:
      # firmware/esp-idf/rust-toolchain.toml pins channel = "esp", which this
      # job does not install.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify Cargo.lock is in sync with Cargo.toml
        working-directory: firmware/esp-idf
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Verify Cargo.lock is committed
        run: test -f firmware/esp-idf/Cargo.lock || { echo "::error::Cargo.lock must be committed"; exit 1; }

  # Bare-metal no_std firmware (firmware/nostd). It has the trigger and the rate
  # limit now, so it is no longer only an entropy spike.
  #
  # Built in place. It used to be copied to $RUNNER_TEMP first, because the repo
  # root's .cargo/config.toml targeted xtensa-esp32s3-espidf with
  # `build-std = ["std", "panic_abort"]`, cargo *joins* config arrays rather
  # than replacing them, and the result tried to build `std` for
  # xtensa-esp32s3-none-elf. The root config now lives inside firmware/esp-idf,
  # so this crate sees only its own.
  firmware-nostd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup ESP-RS toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          # no_std links directly; ldproxy is only needed for esp-idf `std`.
          ldproxy: false
          version: 1.97.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-nostd-${{ hashFiles('firmware/nostd/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nostd-

      - name: Build
        working-directory: firmware/nostd
        run: cargo build --release --locked

      - name: Check formatting
        working-directory: firmware/nostd
        run: cargo fmt --all -- --check

      # --lib --bins, not --all-targets: --all-targets builds the `lib test`
      # target, which needs the `test` crate and a #[panic_handler] that a
      # no_std binary cannot provide. There are no test targets here anyway.
      - name: Clippy
        working-directory: firmware/nostd
        run: cargo clippy --lib --bins --locked -- -D warnings

  # The host workspace: icesickle-core and the verify-attestation tool.
  #
  # This is where the signing path is actually covered. Ed25519 signing and
  # postcard encoding are both deterministic, so with the seed and clock passed
  # in as parameters the whole path is testable with no ESP32 and no emulator --
  # which matters, because QEMU cannot reach this code (esp_hal::init() does not
  # return under it) and hardware is not available.
  #
  # Plain cargo from the repo root. No --manifest-path, no cd out of the
  # checkout, no RUSTUP_TOOLCHAIN override: the root is a virtual workspace with
  # no target pin and no toolchain pin.
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Separate `-p` invocations, not `--workspace`. Cargo's v2 resolver
      # unifies features across the packages selected by a single invocation,
      # and verify-attestation pulls ed25519-dalek with `std`. Testing them
      # together would build icesickle-core against a std-enabled graph.
      - name: Test icesickle-core
        run: cargo test -p icesickle-core --locked

      - name: Test verify-attestation
        run: cargo test -p verify-attestation --locked

      # The no_std guarantee, enforced rather than asserted in a comment. A
      # bare-metal target has no `std` to fall back on, so an accidental `std`
      # dependency -- direct, transitive, or feature-unified -- fails here.
      - name: Build icesickle-core for a bare-metal target
        run: cargo build -p icesickle-core --target thumbv7em-none-eabihf --locked

  # Boot the no_std firmware under Espressif's QEMU and verify what it emits.
  #
  # This is the first job that actually RUNS IceSickle rather than compiling it.
  #
  # What it can prove: the firmware boots, the entropy gate is demonstrated in
  # the right order, an attestation is produced, the fixed-length padding holds,
  # and the signature verifies over the signed bytes.
  #
  # What it CANNOT prove: anything about entropy quality. QEMU's RNG model
  # (hw/misc/esp32_rng.c) returns host randomness from qemu_guest_getrandom
  # regardless of whether the SAR-ADC entropy path is enabled. Statistical
  # validation of the TRNG requires real silicon. See docs/NOSTD_ENTROPY_SPIKE.md.
  emulator:
    runs-on: ubuntu-latest
    env:
      QEMU_REL: esp-develop-9.2.2-20260417
      QEMU_TAR: qemu-xtensa-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz
    steps:
      - uses: actions/checkout@v4

      - name: Setup ESP-RS toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: false
          version: 1.97.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      # console-uart, not the default console-auto: `auto` probes a
      # USB-Serial-JTAG register QEMU does not model, and the output would go to
      # a device -nographic never reads.
      - name: Build firmware
        working-directory: firmware/nostd
        run: cargo build --release --locked --no-default-features --features console-uart

      - name: Install espflash
        run: |
          curl -sSL -o espflash.zip \
            https://github.com/esp-rs/espflash/releases/latest/download/espflash-x86_64-unknown-linux-gnu.zip
          unzip -o espflash.zip -d "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/espflash"
          espflash --version

      - name: Build flash image
        working-directory: firmware/nostd
        run: |
          espflash save-image \
            --chip esp32s3 \
            --flash-size 16mb \
            --merge \
            target/xtensa-esp32s3-none-elf/release/icesickle-nostd \
            "$RUNNER_TEMP/flash.bin"
          ls -l "$RUNNER_TEMP/flash.bin"

      - name: Install QEMU
        run: |
          # The prebuilt qemu-system-xtensa links libSDL2 even when run with
          # -nographic, and the runner image does not ship it.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-2.0-0 libslirp0
          curl -sSL -O "https://github.com/espressif/qemu/releases/download/$QEMU_REL/$QEMU_TAR"
          tar -xf "$QEMU_TAR" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/qemu/bin/qemu-system-xtensa" --version
          echo "--- machines ---"
          "$RUNNER_TEMP/qemu/bin/qemu-system-xtensa" -machine help | grep -i esp32 || true

      - name: Boot firmware in QEMU
        run: |
          # The firmware ends in an idle loop, so it never exits on its own.
          # Run it briefly and keep whatever it printed.
          timeout 45 "$RUNNER_TEMP/qemu/bin/qemu-system-xtensa" \
            -nographic \
            -machine esp32s3 \
            -drive "file=$RUNNER_TEMP/flash.bin,if=mtd,format=raw" \
            -d guest_errors,unimp \
            -D "$RUNNER_TEMP/qemu-debug.log" \
            > "$RUNNER_TEMP/serial.log" 2>&1 || true
          echo "--- serial output ---"
          cat "$RUNNER_TEMP/serial.log"
          echo "--- qemu guest_errors / unimplemented ---"
          head -60 "$RUNNER_TEMP/qemu-debug.log" 2>/dev/null || echo "(no debug log)"

      - name: Assert the image boots and the app starts
        run: |
          grep -q "Loaded app from partition" "$RUNNER_TEMP/serial.log" \
            || { echo "::error::bootloader did not load the app"; exit 1; }
          grep -q "IceSickle no_std firmware" "$RUNNER_TEMP/serial.log" \
            || { echo "::error::app produced no output; console or startup regressed"; exit 1; }
          echo "image boots, bootloader loads it, app runs and prints"

      # RUSTUP_TOOLCHAIN is set because the xtensa-toolchain step above made
      # `esp` the default; the workspace root itself pins nothing.
      - name: Verify the attestation, if one was produced
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          if grep -q "payload:" "$RUNNER_TEMP/serial.log"; then
            cargo run --quiet -p verify-attestation --locked -- "$RUNNER_TEMP/serial.log"
          else
            echo "::notice::No attestation under QEMU: esp_hal::init() does not return (see job comment). Signing is covered by the verify-attestation unit tests; end-to-end needs Wokwi or hardware."
          fi
