[package]
edition      = "2024"
name         = "icesickle-nostd"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "icesickle-nostd"
path = "./src/bin/main.rs"

# Versions below are whatever `esp-generate 1.3.0 --chip esp32s3 -o unstable-hal
# -o esp-backtrace -o log` produced, reconciled rather than hand-picked. The
# `unstable` feature on esp-hal is required: `Trng`/`TrngSource` are gated
# behind `#[instability::unstable]`.
[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
# `log` is not a direct dependency: this binary prints via esp-println. The
# log-04 features above still route esp-hal's own internal records.
log                    = "0.4.27"

critical-section = "1.2.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
# `auto` console selection is the default on hardware. It picks UART vs
# USB-Serial-JTAG by reading USB_DEVICE_INT_RAW, which QEMU does not model --
# the bit reads as garbage and output vanishes into an unwatched device. The
# emulator job builds with `--no-default-features --features console-uart`.
esp-println = { version = "0.17.0", default-features = false, features = [
  "esp32s3",
  "log-04",
  "colors",
  "critical-section",
] }


# Attestation logic: payload encoding, fixed-length padding, ephemeral-key
# signing. Platform-independent and host-testable, which is where the signing
# path is actually covered -- QEMU cannot reach this code (esp_hal::init() does
# not return under it) and hardware is not available.
icesickle-core = { path = "../../crates/icesickle-core" }

[features]
default = ["console-auto"]
# Pick the console device by probing USB-Serial-JTAG at runtime (hardware).
console-auto = ["esp-println/auto"]
# Force UART0. Required under QEMU; also the right choice for a headless device.
console-uart = ["esp-println/uart"]

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
