[package]
name = "icesickle-core"
version = "0.1.0"
edition = "2021"
description = "Platform-independent IceSickle attestation logic: payload encoding, fixed-length padding, ephemeral-key signing"
license = "Apache-2.0"
publish = false

# no_std, no allocator, no hardware. Every hardware dependency -- entropy and
# the clock -- is a parameter supplied by the caller, which is what makes this
# crate testable on a host with no ESP32 and no emulator:
#
#     cargo test -p icesickle-core
#
# Test it alone, not as part of `cargo test --workspace`. Cargo's v2 resolver
# unifies features across the packages selected by one invocation, and
# verify-attestation depends on ed25519-dalek with `std`. Building both together
# would hand this crate a std-enabled dependency graph and quietly mask a
# no_std regression here.

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
zeroize = { version = "1", default-features = false, features = ["derive"] }
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1", default-features = false }
heapless = { version = "0.8", default-features = false }
